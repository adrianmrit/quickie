[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickie-runner"
dynamic = ["version"]
description = "A CLI tool for quick tasks."
readme = "README.md"
authors = [
    { name = "Adrian Martinez Rodriguez", email = "adrianmrit@gmail.com" }
]
license = { file = "LICENSE" }
keywords = ["CLI", "quick", "tasks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.12"
dependencies=[
    "frozendict>=2.4",
    "oslex>=2.0",
    "python-dotenv>=1.2",
    "rich>=15.0",
    "argcomplete>=3.6",
    "fastmcp>=3.4",
]

[project.urls]
Homepage = "https://github.com/adrianmrit/quickie"
Documentation = "https://quickie.readthedocs.io"
Repository = "https://github.com/adrianmrit/quickie.git"
Issues = "https://github.com/adrianmrit/quickie/issues"
Changelog = "https://github.com/adrianmrit/quickie/blob/main/CHANGELOG.md"

[project.optional-dependencies]

[project.scripts]
"qk" = "quickie._cli:main"
"qk-mcp" = "quickie.mcp:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/quickie"]

[tool.hatch.version]
path = "src/quickie/_meta.py"

[tool.hatch.build]
exclude = ["_qk"]

[tool.pytest.ini_options]
addopts = ["-vv"]
markers = [
    "unit",
    "integration",
    "anyio"
]
python_files = "tests/*.py"
mock_use_standalone_module = true

[tool.coverage.run]
source = ["src/quickie"]
omit = [
    "tests/*",
    "_qk/*"
]

[tool.ruff]

[tool.ruff.lint]
select = [
    "PL",  # pylint
    "E",   # pycodestyle
    "F",   # pyflakes
    "D",   # pydocstyle
]
fixable = ["ALL"]
ignore = ["D106", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[dependency-groups]
dev = [
    "sphinx>=9.1",
    "sphinx-toolbox>=4.3",
    "sphinx-rtd-theme>=3.1",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-mock>=3.15",
    "pre-commit>=4.6",
    "mock>=5.2",
    "twine>=7.0",
    "build>=1.5",
    "ruff>=0.16",
]
