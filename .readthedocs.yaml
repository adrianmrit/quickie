version: "2"

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  jobs:
    post-install:
      - pip install uv
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --all-extras --dev --link-mode=copy

python:
  install:
    - method: "pip"
      path: ".[dev]"


sphinx:
  configuration: docs/source/conf.py


formats:
   - pdf
   - epub
